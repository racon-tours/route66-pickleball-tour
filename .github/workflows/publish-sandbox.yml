# Publishes this branch to the password-protected preview at sandbox.pickle.tours/r66/,
# plus the pickle.tours "sandbox" branch at sandbox.pickle.tours/pdt/ (run it from the Actions tab after changing that branch)
# every time the "sandbox" branch changes (or on demand from the Actions tab), with no Mac involved.
#
# Credentials come from 1Password (vault RaconTours) through the read-only service account:
#   repo secret OP_SERVICE_ACCOUNT_TOKEN             — the service account's token (Mike adds it once)
#   op://RaconTours/Cloudflare API Token/credential + /Account ID — needs Workers Scripts edit + Workers Routes edit
#   op://RaconTours/GitHub Personal Access Token/token          — reads pickle-sandbox + pickle-tours
name: Publish sandbox
on:
  push:
    branches: [sandbox]
  workflow_dispatch:
concurrency: { group: publish-sandbox, cancel-in-progress: true }
permissions: { contents: read }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Load credentials from 1Password
        uses: 1password/load-secrets-action@v2
        with: { export-env: true }
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://RaconTours/Cloudflare API Token/credential
          CLOUDFLARE_ACCOUNT_ID: op://RaconTours/Cloudflare API Token/Account ID
          GH_READ_TOKEN: op://RaconTours/GitHub Personal Access Token/token
      - uses: actions/checkout@v4
        with: { ref: sandbox, path: r66 }
      - uses: actions/checkout@v4
        with: { repository: racon-tours/pickle-sandbox, token: '${{ env.GH_READ_TOKEN }}', path: ps }
      - uses: actions/checkout@v4
        with:
          repository: racon-tours/pickle-tours
          ref: directors-page
          token: ${{ env.GH_READ_TOKEN }}
          path: pt
          sparse-checkout: |
            directors.html
            directors-thanks.html
            favicon.svg
            assets/pdt-wordmark-green.png
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: racon-tours/pickle-tours
          ref: sandbox
          token: ${{ env.GH_READ_TOKEN }}
          path: ptsb
      - name: Build
        run: |
          python3 -m pip install --quiet markdown
          bash ps/build-public.sh r66 pt ptsb
      - name: Publish to Cloudflare
        working-directory: ps
        run: npx --yes wrangler@4 deploy
