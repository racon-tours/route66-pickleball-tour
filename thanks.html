<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're on the list — Pickle Tours</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ultra&family=Oswald:wght@600&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FAF7F0;--ink:#26241F;--court:#2D6E9E;--court-deep:#1F5378;--line:#F4EFE3;--route:#C6472E;--shield:#E2A93B}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Source Serif 4',Georgia,serif;background:var(--court);color:var(--line);
    min-height:100vh;display:grid;place-items:center;padding:2rem;text-align:center;
    position:relative;overflow:hidden;
  }
  body::before,body::after{content:"";position:absolute;left:0;right:0;height:5px;background:var(--line);opacity:.5}
  body::before{top:3rem}body::after{bottom:3rem}
  .label{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.18em;font-size:.78rem;color:var(--shield)}
  h1{font-family:'Ultra',serif;font-weight:400;font-size:clamp(2rem,6vw,3.6rem);margin:1rem 0 1.2rem;text-shadow:4px 4px 0 var(--court-deep)}
  p{max-width:32rem;margin:0 auto 2rem;font-size:1.1rem;line-height:1.65}
  a.btn{
    display:inline-block;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:.14em;font-size:.85rem;text-decoration:none;background:var(--route);color:var(--line);
    padding:.75rem 1.5rem;box-shadow:3px 3px 0 var(--ink);
  }
  a.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
</style>
</head>
<body>
  <main>
    <p class="label">Position secured</p>
    <h1>You're on the list.</h1>
    <p>We'll email you the 2027 departure dates and pricing before booking opens to anyone else. Until then — work on that third-shot drop.</p>
    <a class="btn" href="/">Back to the road</a>
  </main>
</body>
</html>
